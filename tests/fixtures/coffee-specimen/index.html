<!doctype html><html><body>
<main>
  <h1>Coffee</h1>
  <section id="menu"></section>
  <section>
    <div id="cart"></div>
    <div><span>Subtotal</span> <span data-testid="subtotal-value"></span></div>
    <div><span>Tax</span> <span data-testid="tax-value"></span></div>
    <div><span>Total</span> <span data-testid="total-value"></span></div>

    <input data-testid="checkout-phone" placeholder="Phone">
    <button data-testid="checkout-submit" disabled>Checkout</button>
  </section>
  <section id="confirmation" hidden></section>
</main>
<script src="app.js"></script>
</body></html>
